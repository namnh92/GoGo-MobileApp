name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here deploys, publishes or reaches a provider, so nothing
# here needs a credential — and a workflow that cannot write is one fewer place
# a leaked token would matter.
permissions:
  contents: read

jobs:
  checks:
    name: lint / typecheck / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The version comes from packageManager in package.json, so it cannot
      # drift from what developers run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: a lockfile that does not match package.json fails
      # here rather than resolving to something nobody has run locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The app is configured entirely through EXPO_PUBLIC_* variables that Zod
      # validates at startup (FND-006), so a broken .env.example is a broken
      # first run for whoever clones the repo next. Nothing else checks it.
      - name: .env.example satisfies the config schema
        run: |
          set -euo pipefail
          cp .env.example .env.ci
          set -a; . ./.env.ci; set +a
          rm -f .env.ci
          node --input-type=module -e "
            const url = process.env.EXPO_PUBLIC_API_URL;
            const web = process.env.EXPO_PUBLIC_WEB_BASE_URL;
            const env = process.env.EXPO_PUBLIC_ENV;
            const flavors = ['dev', 'stag', 'prod'];
            if (!flavors.includes(env)) throw new Error(\`EXPO_PUBLIC_ENV must be one of \${flavors} — got \${env}\`);
            for (const [name, value] of [['EXPO_PUBLIC_API_URL', url], ['EXPO_PUBLIC_WEB_BASE_URL', web]]) {
              if (!value) throw new Error(\`\${name} is missing\`);
              new URL(value);
            }
            if (url.startsWith('http://localhost')) {
              throw new Error('EXPO_PUBLIC_API_URL points at localhost. DEV is remote-first: the example must work for someone who has not run a backend.');
            }
            console.log('ok:', env, url, web);
          "
