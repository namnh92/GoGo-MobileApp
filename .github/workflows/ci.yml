name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here deploys, publishes or reaches a provider, so nothing
# here needs a credential — and a workflow that cannot write is one fewer place
# a leaked token would matter.
permissions:
  contents: read

jobs:
  checks:
    name: lint / typecheck / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The version comes from packageManager in package.json, so it cannot
      # drift from what developers run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: a lockfile that does not match package.json fails
      # here rather than resolving to something nobody has run locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # A second runner, not a duplicate: `pnpm test` is vitest over pure
      # TypeScript, while these render the screens under jest-expo — the
      # state matrix, the location permission branches, the map adapter's
      # fallback and the optimistic rollbacks. They are the only gate that
      # runs React Native code, so leaving them out of CI meant a screen
      # could break with every check above still green.
      - run: pnpm test:ui

      # schema.d.ts is generated from openapi/gogo.v1.yaml and committed, so
      # the two can drift silently — an edited spec with stale types, or
      # hand-edited types. Everything the app knows about the API comes from
      # that file, so regenerating and diffing is the only check that the
      # contract the code compiles against is the contract in the repo.
      - run: pnpm api:check

      # app.config.ts decides what the native projects become, and nothing above
      # reads it. Two defects reached develop that way and only surfaced when
      # someone opened Xcode: plugins were declared for expo-location and
      # expo-secure-store, which were never installed, and `icon` pointed at
      # ./assets/icon.png in a repository with no assets directory. Both stopped
      # `expo prebuild` before it wrote a line.
      #
      # Resolving the config for each flavour runs the plugin chain and the asset
      # lookups without generating anything, so the failure lands on the pull
      # request instead of in a developer's build.
      - name: app.config.ts resolves for every flavour
        # Compile-only fixtures: this job never initializes a provider SDK.
        env:
          ONESIGNAL_APP_ID: '00000000-0000-4000-8000-000000000001'
          ONESIGNAL_APNS_MODE: production
          GOOGLE_MAPS_IOS_API_KEY: ci-ios-map-fixture
          GOOGLE_MAPS_ANDROID_API_KEY: ci-android-map-fixture
          TENJIN_IOS_SDK_KEY: ci-ios
          TENJIN_ANDROID_SDK_KEY: ci-android
        run: |
          set -euo pipefail
          for flavor in dev stag prod; do
            # `expo config` prints "env: load .env" to stdout before the JSON,
            # so the object is taken from the first brace rather than the first
            # line.
            provider_env="$flavor"
            if [ "$flavor" = stag ]; then provider_env=staging; fi
            EXPO_PUBLIC_ENV="$flavor" ONESIGNAL_CONFIG_ENV="$provider_env" TENJIN_CONFIG_ENV="$provider_env" npx expo config --type prebuild --json \
              | sed -n '/^{/,$p' > "/tmp/config.$flavor.json"
            echo "  $flavor: config resolves"
          done

      # Resolving the config is not enough on its own. `expo config` runs the
      # plugin chain but never opens the images, so a missing icon passes it and
      # fails later, inside prebuild, after --clean has already deleted the
      # native projects. Measured: removing assets/icon.png left the step above
      # green.
      - name: every file the config points at exists
        run: |
          set -euo pipefail
          for flavor in dev stag prod; do
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('/tmp/config.$flavor.json', 'utf8'));
              const missing = [];
              const seen = new Set();
              (function walk(node) {
                if (typeof node === 'string') {
                  if (node.startsWith('./') && !seen.has(node)) {
                    seen.add(node);
                    if (!fs.existsSync(node)) missing.push(node);
                  }
                  return;
                }
                if (Array.isArray(node)) return node.forEach(walk);
                if (node && typeof node === 'object') return Object.values(node).forEach(walk);
              })(config);
              if (missing.length) {
                console.error('$flavor references files that do not exist:');
                for (const path of missing) console.error('  ' + path);
                process.exit(1);
              }
              console.log('  $flavor: ' + seen.size + ' referenced file(s), all present');
            "
          done

      # NTF-APP-009 (#173) — resolving the config is still not enough. The
      # plugin chain only *writes* the native projects during prebuild, and two
      # defects lived in that gap:
      #
      #   - `with-onesignal-identity-beta.js` pins OneSignalXCFramework to the
      #     Identity Verification beta. A native project generated before the
      #     plugin existed kept the 5.5.x range, which does not export
      #     `OSUserJwtInvalidatedListener`, and the Swift module stopped
      #     compiling.
      #   - The stale Pods omitted the local Expo module entirely. `xcodebuild`
      #     printed BUILD SUCCEEDED without compiling it, shipped an app with no
      #     native module, and the app died with SIGSEGV at first use.
      #
      # The second is the reason this is a check and not a build: a green build
      # is exactly what that failure looks like. `--no-install` because pods
      # need macOS; what is asserted here is what prebuild *generated*.
      - name: prebuild generates a complete native project
        env:
          ONESIGNAL_APP_ID: '00000000-0000-4000-8000-000000000001'
          ONESIGNAL_CONFIG_ENV: dev
          ONESIGNAL_APNS_MODE: development
          GOOGLE_MAPS_IOS_API_KEY: ci-ios-map-fixture
          GOOGLE_MAPS_ANDROID_API_KEY: ci-android-map-fixture
          TENJIN_CONFIG_ENV: dev
          TENJIN_IOS_SDK_KEY: ci-ios
          TENJIN_ANDROID_SDK_KEY: ci-android
          EXPO_PUBLIC_ENV: dev
        # No `continue-on-error`, no `|| true`: prebuild's exit code is the
        # step's. A masked failure here is how a broken native project reaches
        # a developer's machine looking fine.
        run: |
          set -euo pipefail
          npx expo prebuild -p ios --no-install --clean
          npx expo prebuild -p android --no-install --clean
          pnpm check:native

      # The app is configured entirely through EXPO_PUBLIC_* variables that Zod
      # validates at startup (FND-006), so a broken .env.example is a broken
      # first run for whoever clones the repo next. Nothing else checks it.
      - name: .env.example satisfies the config schema
        run: |
          set -euo pipefail
          cp .env.example .env.ci
          set -a; . ./.env.ci; set +a
          rm -f .env.ci
          node --input-type=module -e "
            const url = process.env.EXPO_PUBLIC_API_URL;
            const web = process.env.EXPO_PUBLIC_WEB_BASE_URL;
            const env = process.env.EXPO_PUBLIC_ENV;
            const flavors = ['dev', 'stag', 'prod'];
            if (!flavors.includes(env)) throw new Error(\`EXPO_PUBLIC_ENV must be one of \${flavors} — got \${env}\`);
            for (const [name, value] of [['EXPO_PUBLIC_API_URL', url], ['EXPO_PUBLIC_WEB_BASE_URL', web]]) {
              if (!value) throw new Error(\`\${name} is missing\`);
              new URL(value);
            }
            if (url.startsWith('http://localhost')) {
              throw new Error('EXPO_PUBLIC_API_URL points at localhost. DEV is remote-first: the example must work for someone who has not run a backend.');
            }
            console.log('ok:', env, url, web);
          "
